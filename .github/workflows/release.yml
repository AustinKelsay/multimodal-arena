name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Validate tag matches manifest
        run: test "v$(node -p "require('./benchlocal.pack.json').version")" = "$GITHUB_REF_NAME"
      - name: Assemble standalone bundle
        run: |
          mkdir -p release/multimodal-arena
          cp -R dist src test release/multimodal-arena/
          cp benchlocal.pack.json index.html package.json package-lock.json README.md LICENSE release/multimodal-arena/
          cd release
          zip -qr "multimodal-arena-${GITHUB_REF_NAME}.zip" multimodal-arena
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/multimodal-arena-*.zip

